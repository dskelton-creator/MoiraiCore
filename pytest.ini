[pytest]
# MoiraiCore local test gate.
# This shadows the global ~/pytest.ini (the WFM project's gate, which lists
# `tests` in norecursedirs and would silently skip this suite). pytest uses the
# nearest config file, so placing one here keeps MoiraiCore's tests collectable
# regardless of what the home-level config says.
#
# Run:  python3 -m pytest -q
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -ra
