[project]
name = "moiraicore"
version = "2.0.0"
description = "Local-first AI orchestration platform with a 3-tier agent pipeline"
requires-python = ">=3.9"
readme = "README.md"
license = { text = "MIT" }
dependencies = [
    "bcrypt>=4.0",
    "PyJWT>=2.0",
]
optional-dependencies = [
    "python-dotenv>=1.0",   # for .env loading (optional, env vars work without it)
    "markdown>=3.0",         # for markdown rendering in outputs
    "PyYAML>=6.0",           # for config parsing
]

[project.scripts]
moiraicore = "scripts.server:main"

[tool.setuptools.packages.find]
include = ["scripts*"]